services:
  builder:
    image: devos-builder:trixie
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DEVOS_MIRROR_COUNTRY: ${DEVOS_MIRROR_COUNTRY:-iran}
        DEVOS_DEBIAN_MIRRORS: ${DEVOS_DEBIAN_MIRRORS:-http://mirror.iranserver.com/debian/|http://mirror.iranserver.com/debian-security/,http://mirror.arvancloud.ir/debian/|http://mirror.arvancloud.ir/debian-security/,http://mirror.famaserver.com/debian/|http://mirror.iranserver.com/debian-security/,http://deb.debian.org/debian/|http://security.debian.org/debian-security/}
    privileged: true
    working_dir: /workspace
    environment:
      DEVOS_MIRROR_COUNTRY: ${DEVOS_MIRROR_COUNTRY:-iran}
      DEVOS_PYPI_MIRRORS: ${DEVOS_PYPI_MIRRORS:-https://mirror.novin.cloud/artifactory/api/pypi/pypi/simple/,https://mirror2.chabokan.net/pypi/simple/,https://pypi.hyperclouds.ir/simple/}
      DEVOS_DEBIAN_MIRRORS: ${DEVOS_DEBIAN_MIRRORS:-http://mirror.iranserver.com/debian/|http://mirror.iranserver.com/debian-security/,http://mirror.arvancloud.ir/debian/|http://mirror.arvancloud.ir/debian-security/,http://mirror.famaserver.com/debian/|http://mirror.iranserver.com/debian-security/,http://deb.debian.org/debian/|http://security.debian.org/debian-security/}
      DEVOS_DEBIAN_MIRROR: ${DEVOS_DEBIAN_MIRROR:-http://mirror.iranserver.com/debian/}
      DEVOS_SECURITY_MIRROR: ${DEVOS_SECURITY_MIRROR:-http://mirror.iranserver.com/debian-security/}
    volumes:
      - type: bind
        source: ./assets
        target: /source/assets
        read_only: true
      - type: bind
        source: ./auto
        target: /source/auto
        read_only: true
      - type: bind
        source: ./config
        target: /source/config
        read_only: true
      - type: bind
        source: ./scripts
        target: /source/scripts
        read_only: true
      - type: bind
        source: ./.devos-ssh.pub
        target: /source/ssh/devos-ssh.pub
        read_only: true
      - type: volume
        source: devos-workspace
        target: /workspace
      - type: bind
        source: ./build
        target: /workspace/build
        bind:
          create_host_path: true

volumes:
  devos-workspace:
